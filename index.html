<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA Reminder Automation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

  <!-- Navbar -->
  <nav class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2 font-bold text-lg text-emerald-600">
        <span>📱</span> WA Reminder
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openSettings()" class="text-sm px-3 py-1.5 rounded-lg border border-slate-300 hover:bg-slate-100">
          ⚙️ Pengaturan
        </button>
        <button id="btnLogout" onclick="logout()" class="hidden text-sm px-3 py-1.5 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100">
          Keluar
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 mt-4">
    <!-- Pesan belum konfigurasi -->
    <div id="setupNotice" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-6 text-center">
      <h2 class="font-bold text-amber-800 text-lg mb-2">Hubungkan ke Supabase</h2>
      <p class="text-sm text-amber-700 mb-4">Masukkan Project URL dan Publishable Key Supabase kamu untuk mulai menggunakan aplikasi.</p>
      <button onclick="openSettings()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">
        Buka Pengaturan
      </button>
    </div>

    <!-- Layar Login -->
    <div id="loginSection" class="hidden max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200 mt-8">
      <h2 class="text-xl font-bold mb-1">Masuk ke Dashboard</h2>
      <p class="text-sm text-slate-500 mb-5">Gunakan akun yang dibuat di Supabase Authentication.</p>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Email</label>
          <input id="loginEmail" type="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password</label>
          <input id="loginPassword" type="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <p id="loginError" class="text-sm text-rose-600 hidden"></p>
        <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white font-medium rounded-lg hover:bg-emerald-700">
          Masuk
        </button>
      </form>
    </div>

    <!-- Dashboard Utama -->
    <div id="appSection" class="hidden space-y-6">
      <!-- Form Tambah Jadwal -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-bold text-lg mb-4">Buat Jadwal Reminder Baru</h2>
        <form id="reminderForm" onsubmit="saveReminder(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Nama Penerima</label>
            <input id="recipientName" type="text" required placeholder="Contoh: Budi" class="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Nomor WhatsApp (awalan 62)</label>
            <div class="flex gap-2">
              <input id="phoneNumber" type="text" required placeholder="6281234567890" class="w-full px-3 py-2 border rounded-lg text-sm" />
              <button type="button" onclick="formatPhone()" class="px-2.5 py-2 text-xs bg-slate-100 border rounded-lg hover:bg-slate-200 whitespace-nowrap">
                08 → 62
              </button>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Tanggal & Jam Kirim</label>
            <input id="scheduledAt" type="datetime-local" required class="w-full px-3 py-2 border rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Pengulangan</label>
            <select id="recurrence" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
              <option value="none">Sekali saja</option>
              <option value="daily">Harian</option>
              <option value="weekly">Mingguan</option>
              <option value="monthly">Bulanan</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium mb-1">Isi Pesan</label>
            <textarea id="messageText" rows="3" required placeholder="Tulis pesan reminder di sini..." class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
          </div>
          <div class="md:col-span-2 flex justify-end">
            <button type="submit" id="btnSave" class="px-5 py-2 bg-emerald-600 text-white text-sm font-medium rounded-lg hover:bg-emerald-700">
              + Simpan Jadwal
            </button>
          </div>
        </form>
      </div>

      <!-- Daftar Jadwal -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-lg">Daftar Jadwal</h2>
          <button onclick="loadReminders()" class="text-sm text-emerald-600 hover:underline">↻ Refresh</button>
        </div>
        <div id="reminderList" class="space-y-3">
          <p class="text-sm text-slate-400 text-center py-4">Memuat data...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Pengaturan -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
      <h3 class="font-bold text-lg mb-4">Pengaturan Supabase</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Project URL</label>
          <input id="cfgUrl" type="url" placeholder="https://xxxx.supabase.co" class="w-full px-3 py-2 border rounded-lg text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Publishable / Anon Key</label>
          <input id="cfgKey" type="text" placeholder="sb_publishable_..." class="w-full px-3 py-2 border rounded-lg text-sm" />
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeSettings()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
        <button onclick="saveSettings()" class="px-4 py-2 text-sm bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Simpan</button>
      </div>
    </div>
  </div>

  <script>
    let sb = null;

    function init() {
      const url = localStorage.getItem('sb_url');
      const key = localStorage.getItem('sb_key');
      if (!url || !key) {
        document.getElementById('setupNotice').classList.remove('hidden');
        return;
      }
      sb = window.supabase.createClient(url, key);
      checkSession();
    }

    async function checkSession() {
      const { data: { session } } = await sb.auth.getSession();
      document.getElementById('setupNotice').classList.add('hidden');
      if (session) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('btnLogout').classList.remove('hidden');
        loadReminders();
      } else {
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('btnLogout').classList.add('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = 'Gagal masuk: ' + error.message;
        errEl.classList.remove('hidden');
      } else {
        checkSession();
      }
    }

    async function logout() {
      await sb.auth.signOut();
      checkSession();
    }

    function formatPhone() {
      const el = document.getElementById('phoneNumber');
      let val = el.value.replace(/[^0-9]/g, '');
      if (val.startsWith('0')) val = '62' + val.slice(1);
      el.value = val;
    }

    async function saveReminder(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSave');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      const payload = {
        recipient_name: document.getElementById('recipientName').value.trim(),
        phone_number: document.getElementById('phoneNumber').value.replace(/[^0-9]/g, ''),
        message: document.getElementById('messageText').value.trim(),
        scheduled_at: new Date(document.getElementById('scheduledAt').value).toISOString(),
        recurrence: document.getElementById('recurrence').value,
        status: 'pending'
      };

      const { error } = await sb.from('reminders').insert([payload]);
      btn.disabled = false;
      btn.textContent = '+ Simpan Jadwal';

      if (error) {
        alert('Gagal menyimpan jadwal: ' + error.message);
      } else {
        document.getElementById('reminderForm').reset();
        loadReminders();
      }
    }

    async function loadReminders() {
      const list = document.getElementById('reminderList');
      const { data, error } = await sb
        .from('reminders')
        .select('*')
        .order('scheduled_at', { ascending: true });

      if (error) {
        list.innerHTML = `<p class="text-sm text-rose-600">Error: ${error.message}</p>`;
        return;
      }
      if (!data.length) {
        list.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">Belum ada jadwal reminder.</p>`;
        return;
      }

      const badges = {
        pending: 'bg-amber-100 text-amber-800',
        sent: 'bg-emerald-100 text-emerald-800',
        failed: 'bg-rose-100 text-rose-800'
      };
      const labels = { none: 'Sekali', daily: 'Harian', weekly: 'Mingguan', monthly: 'Bulanan' };

      list.innerHTML = data.map(r => `
        <div class="border border-slate-200 rounded-lg p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-semibold text-sm">${r.recipient_name}</span>
              <span class="text-xs text-slate-500">(${r.phone_number})</span>
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badges[r.status] || ''}">${r.status}</span>
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${labels[r.recurrence] || r.recurrence}</span>
            </div>
            <p class="text-sm text-slate-700 mt-1 whitespace-pre-wrap">${r.message}</p>
            <p class="text-xs text-slate-400 mt-1">📅 ${new Date(r.scheduled_at).toLocaleString('id-ID')}</p>
          </div>
          <button onclick="deleteReminder('${r.id}')" class="text-xs text-rose-600 hover:bg-rose-50 px-2.5 py-1.5 rounded-lg self-start sm:self-center">
            Hapus
          </button>
        </div>
      `).join('');
    }

    async function deleteReminder(id) {
      if (!confirm('Hapus jadwal ini?')) return;
      const { error } = await sb.from('reminders').delete().eq('id', id);
      if (error) alert('Gagal menghapus: ' + error.message);
      else loadReminders();
    }

    function openSettings() {
      document.getElementById('cfgUrl').value = localStorage.getItem('sb_url') || '';
      document.getElementById('cfgKey').value = localStorage.getItem('sb_key') || '';
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      const rawUrl = document.getElementById('cfgUrl').value.trim();
      const key = document.getElementById('cfgKey').value.trim();
      if (!rawUrl || !key) return alert('URL dan Key wajib diisi!');
      try {
        const cleanUrl = new URL(rawUrl).origin;
        localStorage.setItem('sb_url', cleanUrl);
        localStorage.setItem('sb_key', key);
        closeSettings();
        location.reload();
      } catch {
        alert('Format Project URL tidak valid.');
      }
    }

    init();
  </script>
</body>
</html>
